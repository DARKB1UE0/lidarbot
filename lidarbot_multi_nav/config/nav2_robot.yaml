amcl:
  ros__parameters:
    use_sim_time: True
    scan_topic: scan
    min_particle_weight: 0.001
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    set_initial_pose: True
    always_reset_initial_pose: False
    transform_tolerance: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    default_bt_xml_filename: "package://lidarbot_multi_nav/config/behavior_tree.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_goal_reached_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: !!float 20
    required_missed_control_calls: 4
    progress_checker_plugin: progress_checker
    goal_checker_plugin: goal_checker
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: False
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.4
      max_angular_accel: 1.5
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.7
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      transform_tolerance: 0.2

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: [GridBased]
    expected_planner_frequency: !!float 20
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: False

behavior_server:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_link
      update_frequency: !!float 20
      publish_frequency: !!float 20
      rolling_window: True
      width: !!float 6
      height: !!float 6
      resolution: !!float 0.05
      footprint: "[[0.22, 0.18], [0.22, -0.18], [-0.22, -0.18], [-0.22, 0.18]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: !!float 2
          clearing: True
          marking: True
          data_type: LaserScan
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: !!float 0.45
        cost_scaling_factor: !!float 3

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_link
      update_frequency: !!float 5
      publish_frequency: !!float 5
      width: !!float 20
      height: !!float 20
      resolution: !!float 0.05
      track_unknown_space: True
      footprint: "[[0.22, 0.18], [0.22, -0.18], [-0.22, -0.18], [-0.22, 0.18]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: !!float 2
          clearing: True
          marking: True
          data_type: LaserScan
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: !!float 0.55
        cost_scaling_factor: !!float 2

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: !!float 5
