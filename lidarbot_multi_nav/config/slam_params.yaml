slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: "mapping"
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: scan
    resolution: 0.05
    publish_period: 1.0
    max_laser_range: 15.0
    minimum_time_interval: 0.5
    minimum_travel_distance: 0.1
    transform_publish_period: 0.05
    allow_unknown_update: true
