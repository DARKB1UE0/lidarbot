joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.25
    autorepeat_rate: 20.0 # milliseconds

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.4
      
    axis_angular:
      # 使用左摇杆水平方向（通常是 axis 0），避免误把扳机轴映射成旋转导致常态转圈
      yaw: 0 
    scale_angular:
      # 将旋转灵敏度降低到 0.35，避免轻微拨动就高速转弯
      yaw: 0.2
    
    enable_button: 4
    enable_turbo_button: -1 

    require_enable_button: true
